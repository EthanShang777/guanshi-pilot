e="89">泛函数 / xfunc</option><option value="90">深势科技 / DP Technology</option><option value="91">深言科技 / DeepLang</option><option value="92">清析智研 / CleerScience</option><option value="93">清程极智</option><option value="94">灵初智能 / PsiBot</option><option value="95">灵足时代 / RobStride</option><option value="96">猿声科技 / ENSURING</option><option value="97">百图生科 / BioMap</option><option value="98">睿尔曼 / RealMan</option><option value="99">睿岭智能</option><option value="100">穹彻智能 / Noematrix</option><option value="101">算能 / SOPHGO</option><option value="102">联影智能</option><option value="103">舞肌科技 / WUJI TECH</option><option value="104">范式 / 第四范式</option><option value="105">西湖灵犀 / NEURALICORN</option><option value="106">讯飞医疗</option><option value="107">趋动科技</option><option value="108">趋境科技</option><option value="109">跬智信息 / Kyligence</option><option value="110">达观数据 / DataGrand</option><option value="111">途深智合 / Toursynbio</option><option value="112">遨博智能 / AUBO</option><option value="113">阶跃星辰 / StepFun</option><option value="114">飞致云 / FIT2CLOUD</option></select></label><h2></h2><p></p><p></p><a></a> · <a>完整档案</a></section></div><script type="application/json" id="profiles">[{"name": "3Chat.ai", "href": "research-profile-dca84592bcc43b52c04e.html", "claim": "客户运营AI应用的投资重点在实际解决率与留存，而非回复量。人工接管、知识权限和渠道失败处理构成运营闭环；外部工作平台分发可增加触达，也带来渠道依赖和获客成本风险。", "question": "智能客服是否真正降低每个已解决问题的成本并提高留存？", "source": {"title": "3Chat.ai官方社区V5.5更新公告", "url": "https://group.3chatai.cn/t/topic/453"}}, {"name": "Aidoc", "href": "research-profile-0ce4d08045cb9e04de74.html", "claim": "Aidoc可与RapidAI、推想医疗比较从影像算法到院级平台的扩展：统一工作流和第三方算法接入可能降低采购摩擦，也会带来集成服务成本与责任分配问题。CARE基础模型需证明跨任务迁移优于专用模型；基础模型标签不代表自动具备全部诊疗适应证或持续自我改进能力。", "question": "院级AI平台和基础模型能否提升模块复用率及医院净付费，而不是增加集成负担？", "source": {"title": "Aidoc官方临床AI及aiOS平台介绍", "url": "https://www.aidoc.com/"}}, {"name": "Alluxio", "href": "research-profile-f5c33cd1b2b3d0dcd83c.html", "claim": "Alluxio可作为JuiceFS等数据底座的对标：核心卖点是保留原存储并增加缓存，而非重建权威数据源。投资价值取决于节约的GPU空等与跨云传输能否覆盖缓存成本。命中率、冷启动和模型检查点写回风险需分别测量；客户案例的加速比例不能直接外推所有训练任务或商业收入。", "question": "在可复现版本与数据新鲜度约束下，加速的净经济收益如何？", "source": {"title": "Alluxio官方AI缓存架构与场景", "url": "https://www.alluxio.io/"}}, {"name": "Apifox", "href": "research-profile-24037a2f281c26e04970.html", "claim": "Apifox与Apipost形成API开发协作对照；其智能体CLI和MCP路线可能把既有接口资产变成AI编程工具可消费的上下文，价值取决于文档与真实接口的一致性及调用权限。Agent执行追踪有助排错，但不证明模型自我改进。按人数收费在机器调用增长时未必同步扩张，应分开观察开发者席位、自动化使用和AI增购价值。", "question": "智能体对API资产的调用能否转化为可续约的增量收入？ 固定接口变更集后AI提升多少有效缺陷发现率，人工审查与维护净节时多少，企业续费和席位扩张是否受益？", "source": {"title": "Apifox官方API与AI协作平台", "url": "https://apifox.com/"}}, {"name": "Apipost", "href": "research-profile-8d62c6e2a77797663f45.html", "claim": "Apipost补充AI开发工具中的API契约与测试入口，区别于从代码编辑器切入的通用编程助手。既有协作数据与测试流程可能形成分发优势，但生成接口文档不等于与真实服务保持一致；AI功能也可能只是原有企业版的附加项。应核查错误发现与修复成本是否实际下降，以及私有化交付能否产生可持续订阅，而不是仅一次性项目收入。", "question": "AI生成能否改善API契约质量并带来可验证的企业增购？ 固定版本与环境后的回归报告能否复现，失败定位和维护净节时多少，CI活跃是否转化为续费与付费席位？", "source": {"title": "Apipost官方API研发协作平台", "url": "https://www.apipost.cn/"}}, {"name": "AutoMQ", "href": "research-profile-9239f426760a41dac50f.html", "claim": "AutoMQ补充AI数据链路中的消息持久化与弹性基础设施，和Timeplus、RisingWave的流式计算形成分层对照。对象存储可能改善保留成本与扩缩容，但冷读、请求费用、尾延迟和故障域需合并评估。消息层降本并不证明AI业务收入，应区分传统Kafka迁移与新AI数据负载；不将对象存储耐久度直接等同端到端服务可用性。", "question": "秒级分区调整能否转化为更短业务积压和更少人工介入？", "source": {"title": "AutoMQ官方对象存储Kafka架构介绍", "url": "https://www.automq.com/"}}, {"name": "Cradle", "href": "research-profile-4f50c3aafab85ba1fe7e.html", "claim": "作为百图及Profluent等蛋白设计平台的商业模式对标，Cradle更直接检验科研软件订阅价值，而非依赖药物远期里程碑。关键是实验迭代节省是否足以支持持续续费，以及支持、算力与实验服务成本能否形成健康毛利。", "question": "蛋白设计软件能否形成跨项目复用和可持续订阅收入？", "source": {"title": "Cradle官方软件许可方案", "url": "https://www.cradle.bio/licensing"}}, {"name": "DOBOT", "href": "research-profile-ec86eae4dfa7f0e65d37.html", "claim": "DOBOT为中国协作机器人向具身数据工具延伸的对标。与睿尔曼的数据采集体系、穹彻的软件路线比较，硬件供应和工业渠道可能降低部署门槛，但采集平台销量不能替代模型泛化、数据可迁移性和客户复购证据；应将既有协作臂业务与新具身业务分开估值。", "question": "协作机器人基础能否转化为可复用的具身数据与训练平台收入？", "source": {"title": "DOBOT官方X-Trainer数据采集与训练平台", "url": "https://www.dobot-robots.com/products/humanoid-robots/x-trainer.html"}}, {"name": "Daytona", "href": "research-profile-fbca3a097c1c8b690cbc.html", "claim": "与E2B、Modal对照，Daytona可用于研究AI执行层的状态持久化与开发工具集成价值。中国相关项目不能只比启动时延，应比较任务成功率、状态复用和恢复成本，以及对客户自建环境的替代能力；多家相似基础设施竞争意味着低切换成本和价格压力需重点核查。", "question": "有状态执行和开发工具集成能否形成超过通用沙箱的付费壁垒？", "source": {"title": "Daytona官方AI代码运行基础设施", "url": "https://www.daytona.io/"}}, {"name": "Dify", "href": "research-profile-d18aca33a335a81c047b.html", "claim": "Dify的投资价值应从原型工具转向组织级生产管理：是否能把开发者采用转成治理、维护和持续运营预算。开源使用与企业付费是两条漏斗，不应以仓库热度推算收入。", "question": "开发者采用能否变成可规模化的企业付费？", "source": {"title": "Dify Enterprise官方产品及定价说明", "url": "https://dify.ai/pricing/dify-enterprise"}}, {"name": "E2B", "href": "research-profile-14b347469914e2d188f0.html", "claim": "与Modal相比，E2B更强调智能体完整执行环境及客户云部署。对中国AI Infra与Agent公司的价值在于评估执行层能否形成模型无关的开发者黏性，而不是将智能体热度直接等同沙箱利润。应拆分底层计算成本、环境管理软件价值和企业集成负担。", "question": "智能体沙箱能否形成可持续的软件收入，而非低毛利计算转售？", "source": {"title": "E2B官方智能体执行基础设施", "url": "https://e2b.dev/"}}, {"name": "EMQX", "href": "research-profile-d860ba8e3346d3730039.html", "claim": "EMQX补充物理设备与AI之间的实时消息层，可与TDengine时序存储和分析层区分。潜在价值在设备接入、弱网恢复与持续运维，而非单纯接入模型；可靠消息传递不等于执行器安全或任务成功。应核查AI增购是否独立付费，以及云资源、跨区域通信和现场集成对毛利的影响。", "question": "持久消息带来的业务恢复收益，能否覆盖副本存储和延迟成本并形成增购？", "source": {"title": "EMQX官方AI与IoT数据平台介绍", "url": "https://www.emqx.com/en"}}, {"name": "FastGPT", "href": "research-profile-18326ce5b1c34f3f0ac4.html", "claim": "FastGPT补充企业知识库到工作流交付路线，可与Dify、数据项素及MaxKB比较。投资判断应从搭建速度转向权限贯通、引用可追溯和知识更新成本；咨询与定制交付可能提升落地率，也可能侵蚀软件规模化毛利。开源热度和客户标识不是付费续约证据，混合检索也不能保证消除幻觉。", "question": "企业知识库交付能否形成可续约的标准化软件收入？", "source": {"title": "FastGPT官方企业知识库与RAG Agent平台", "url": "https://fastgpt.io/"}}, {"name": "Fireworks AI", "href": "research-profile-eb2a2d4d82060aac827f.html", "claim": "与Together AI、硅基流动和无问芯穹形成推理服务对标：多轮智能体的成本不仅是Token单价，还受缓存复用、重试、路由质量和完成任务概率影响。软件差异化需要在等质量与等负载条件下成立，且不能把客户标识直接等同付费规模。", "question": "缓存与智能路由能否持续降低每个成功任务的全成本？", "source": {"title": "Fireworks官方推理产品说明", "url": "https://fireworks.ai/product/inference"}}, {"name" coBase 3官方产品与治理平台", "url": "https://www.nocobase.com/"}}, {"name": "OceanBase", "href": "research-profile-039f39fb12c83d3bf3d7.html", "claim": "OceanBase为统一数据底座路线补充中国厂商对照，可与PingCAP和Zilliz比较事务、分析及检索的组合。统一引擎可能减少同步维护，但混合负载也需验证资源争用、索引新鲜度和尾延迟。传统关键事务经验是背景，不等于Agent任务正确或AI收入已规模化；应拆分既有数据库迁移、AI查询增量及云托管使用，而不照搬支付峰值指标。", "question": "Agent记忆入口能否产生可归因的数据库付费增量？", "source": {"title": "OceanBase官方统一数据库与AI检索介绍", "url": "https://en.oceanbase.com/"}}, {"name": "PingCAP / TiDB", "href": "research-profile-523156b4752dcad41c9c.html", "claim": "PingCAP提供事务数据库向Agent状态与检索延伸的对照，与Zilliz向量检索路线相比，潜在价值在减少状态、业务记录和向量数据间的同步环节。但数据库事务正确不自动保证Agent重试幂等、外部动作只执行一次或业务判断正确。应区分传统数据库替换收入与AI工作负载增量，避免把客户总规模当Agent付费规模；Cloud Lake公开预览仍需单独验证。", "question": "Agent数据持久化能否转成稳定付费，而不是大量短命免费实例？", "source": {"title": "PingCAP官方TiDB与Agent数据基础设施介绍", "url": "https://www.pingcap.com/"}}, {"name": "Profluent", "href": "research-profile-ce97e523470fbae11862.html", "claim": "可作为百图、分子之心等蛋白设计平台的海外对标：药企合作把模型能力绑定到具体分子需求，但投资价值取决于实验命中质量、可开发性和后续项目兑现。应分开比较平台授权收入与自研资产风险，不能把合作总潜在价值当到账或融资。", "question": "蛋白生成平台能否通过可重复实验与合作续约实现价值兑现？", "source": {"title": "Profluent与BioMarin合作原始公告", "url": "https://www.profluent.bio/media/profluent-partners-with-biomarin-to-design-novel-medicines-using-ai"}}, {"name": "Proscia", "href": "research-profile-4c86c861871b12a3c0f0.html", "claim": "Proscia为Lunit的病理模型提供平台层对照：扫描与阅片流程、数据管理和第三方AI集成可能形成分发入口，但不能把平台兼容等同算法获批。投资研究需区分基础平台收入、模型分成与实施成本，并检验扫描仪兼容和数据迁移是否带来客户黏性，而非只比较模型准确率。", "question": "数字病理平台能否通过数据与工作流形成独立于单一算法的持续价值？", "source": {"title": "Proscia Concentriq官方平台与使用范围说明", "url": "https://proscia.com/"}}, {"name": "Raise3D复志科技", "href": "research-profile-943e016f9d014a126ef2.html", "claim": "研究定位为工业增材制造，而非因文中提及人形机器人就归入机器人本体。竞争关注点从单台设备扩展至多工艺与后处理协同，但产品发布不能证明量产客户采用。", "question": "增长能否转化为可复制的交付与持续收入，而不只是项目数量？", "source": {"title": "Raise3D复志科技公司公开材料", "url": "https://www.prnasia.com/story/555645-1.shtml"}}, {"name": "RapidAI", "href": "research-profile-f4579729ce8bc7d99762.html", "claim": "RapidAI作为推想医疗的海外对标，重点不是单一读片 的路径。与通用对话模型比较，价值应落在格式保真、修改成本和重复使用，而非首稿生成速度；MCP接入可拓展分发，却不能自动保证调用安全或持续付费。需分开终端订阅、企业API与定制交付，检验办公套件内置AI带来的竞争压力。", "question": "文档生成能否形成可留存、可付费的完整编辑工作流？", "source": {"title": "必优科技官方智能文档产品介绍", "url": "https://www.yoo-ai.com/"}}, {"name": "思必驰 / AISpeech", "href": "research-profile-dd8c47db32ba3616172a.html", "claim": "思必驰可与云知声的语音及行业Agent路线比较：办公硬件与终端方案可能提供分发入口，但出货不等于模型服务活跃或持续付费。应拆分硬件毛利、SDK授权和订阅收入，核验售后成本与客户集中度。语音转写、会议总结和可执行Agent是不同能力，不能凭产品入口将三者视为已经打通。", "question": "硬件分发能否形成持续软件收入和使用留存？", "source": {"title": "思必驰官方产品与场景", "url": "https://www.aispeech.com/"}}, {"name": "思码逸 / Merico", "href": "research-profile-13007e3317f4351d8f81.html", "claim": "思码逸可作为AI编程投资研究的效果度量对照，而非仅凭研发效能产品就归为AI原生厂商。代码产出增加未必意味着交付提速：评估AI编程工具需要同时观察返工、缺陷和交付周期，并控制任务难度与团队差异。既有效能数据或有评估价值，但客户评价、代码当量和跨企业基准都不能单独证明AI带来因果收益，也不宜直接替代个人绩效判断。", "question": "研发效能度量能否识别AI编程的真实增量而不是产出数量变化？", "source": {"title": "思码逸DevInsight官方研发效能介绍", "url": "https://www.merico.cn/"}}, {"name": "思迈特 / SmartBI", "href": "research-profile-1c733afabd664d6acee2.html", "claim": "思迈特与跬智构成传统BI向数据智能体演进的对照。优势可能来自既有数据模型、报表和权限，但智能体多步骤执行会放大口径与权限错误，需以可追溯结果而非聊天流畅度评价。ReAct执行反馈属于任务流程，不据此认定递归自我改进；存量BI客户也不能自动转化为AI付费客户。", "question": "数据智能体能否可靠完成复杂报表任务并产生AI增量收入？", "source": {"title": "思迈特官方白泽AgentBI产品介绍", "url": "https://www.smartbi.com.cn/"}}, {"name": "慧创医疗", "href": "research-profile-cf5fe0f7668dce95d3fe.html", "claim": "慧创属于脑科学测量与医疗器械方向，不应因“脑机接口”标签直接归入通用AI模型。研究价值在光学采集、临床流程与设备商业化；脑血流动力学测量并非直接读取思想，成像、辅助诊断与治疗必须分开评估。", "question": "设备现金流与治疗研发能否分别形成可验证进展？", "source": {"title": "清华生医学院校友企业：丹阳慧创", "url": "https://bme.tsinghua.edu.cn/info/1064/1104.htm"}}, {"name": "推想医疗 / Infervision", "href": "research-profile-01fdd4f98ff9880ed645.html", "claim": "推想医疗补充影像AI路径，与森亿的数据治理和讯飞医疗的语音/基层入口形成对照。影像模型性能之外，PACS接入、医生复核负担、收费支付和跨设备泛化决定商业价值；从辅助读片扩展至治疗规划会改变证据和监管要求，不能用科研论文数量替代临床结局或可持续收入。", "question": "影像AI向诊疗全流程扩展能否提高付费深度而不放大交付与监管负担？", "source": {"title": "推想医疗官方产品解决方案", "url": "https://www.infervision.com/"}}, {"name": "擎朗智能 / KEENON", "href": "research-profile-1e8b38cee7fa4e3da9df.html", "claim": "擎朗为观察中国具身服务机器人商业化提供具体场景对标。相比只展示通用人形能力，配送清洁更容易核任务量与运营成本；但单位任务价值受客流、场地改造、人工辅助和售后约束。与富唯、遨博的场景延伸比较，应优先验证原有服务渠道能否转化为新品复购，而非沿用旧业务出货口径。", "question": "服务机器人的实际运营收益是否支持跨场景扩张与新品复购？", "source": {"title": "擎朗智能官方服务机器人与解决方案", "url": "https://www.keenon.cn/"}}, {"name": "数坤科技 / Shukun", "href": "research-profile-bf5f57a4ea93d70f1201.html", "claim": "数坤与推想的多器官影像产品、讯飞医疗的基层入口形成国内对标。由单点辅助诊断扩至医院/基层一体化方案，可能提高客户覆盖，也可能增加集成与售后成本；数字医生智能体名称不能证明自主诊疗或跨病种泛化，医院渗透率也不等于持续付费与高频使用。", "question": "多器官辅助诊疗组合能否提升单院付费与复用效率，而非仅扩大产品目录？", "source": {"title": "数坤科技官方产品与业务布局", "url": "https://www.shukun.net/"}}, {"name": "数据项素 / Dataelem", "href": "research-profile-80fc8d19c247a1e94448.html", "claim": "数据项素补充开源企业Agent从文档工具到团队工作平台的路线，与Dify应用编排和必优文档生成分别比较。产品价值在权限一致、任务可交付与企业运维，开源下载不等于生产采用或付费留存。桌面文件操作和托管应用扩大能力，也增加工具授权、数据隔离及故障恢复的验证需求。", "question": "开源Agent平台能否转化为可管理、持续交付的企业工作系统？", "source": {"title": "数据项素官方产品目录", "url": "https://dataelem.com/"}}, {"name": "明视脑机 / Mindtrix", "href": "research-profile-b329888528d454c8dc42.html", "claim": "视觉重建脑机接口应按严肃医疗器械评估，而非通用AI用户规模。投资价值取决于持续功能获益、长期植入安全和注册支付路径；电极数量与短期实验感知不能直接替代临床终点。", "question": "短期感知结果能否转化为持续、可支付的功能获益？", "source": {"title": "明视脑机官网：公司简介与研发历程", "url": "https://www.mindtrix.cn/about"}}, {"name": "星环科技", "href": "research-profile-4d5304b044f4411f12eb.html", "claim": "星环科技补充数据基础软件延伸AI知识平台的对照，与达观的应用交付及独立智能体平台分别比较。已有数据治理可降低接入门槛，但是否形成AI增量收入需剥离数据库存量合同和定制实施；知识更新、检索增强与模型更新不是同一机制，完整工具目录不等于全流程效果已验证。", "question": "数据基础软件客户能否低成本转化为持续使用的知识平台客户？", "source": {"title": "星环科技官方TKH知识平台介绍", "url": "https://www.transwarp.cn/product/tkh"}}, {"name": "星辰天合 / XSKY", "href": "research-profile-602404cee38aa07ac6a2.html", "claim": "星辰天合补充AI基础设施中的数据供给与存储层，与趋动的算力池化、清程的推理引擎区分。存储带宽改善只有在IO受限的实际负载下才转化为GPU利用率和训练时长收益；不能把检查点写入缩短等比例外推为端到端训练提速。投资上应拆分传统存储替换与AI新增需求，以及软件许可、硬件和服务收入。", "question": "AI存储性能是否在真实训练负载中形成可持续成本优势？", "source": {"title": "星辰天合官方MeshFS产品介绍", "url": "https://www.xsky.com/products/mesh-fs"}}, {"name": "普渡机器人 / PUDU", "href": "research-profile-9ab5ccc0f13fbea0bd08.html", "claim": "普渡可与擎朗对照从配送清洁向复杂操作延伸的路径，与DOBOT、睿尔曼对照双臂与数据采集路线。已有商用渠道可能降低获客成本，但移动搬运到操作任务会增加失败恢复、安全和集成复杂度；投资价值取决于新增操作能力是否带来可复现的单位任务收益，而非旧业务累计出货。", "question": "三店七机能否转化为同一客户持续扩店复购，且不依赖高额驻场服务？", "source": {"title": "普渡官方新一代工业半人形PUDU D7发布", "url": "https://www.pudurobotics.com/en/news/pudu-d7-industrial-humanoid-robot-launch"}}, {"name": "景芮医疗 / GeeReeMed", "href": "research-profile-f1c847da4ac5bedf4ba7.html", "claim": "磁共振兼容监护的价值来自特殊环境中的安全性、信号质量和临床流程适配，不应因具有算法和趋势分析就归为通用AI平台。投资重点是器械合规、医院采购与耗材服务经济，而非演示参数。", "question": "MRI环境下的工程优势能否转化为可重复采购、低维护负担的医院业务？", "source": {"title": "景芮医疗：GH200磁共振病人监护仪", "url": "https://www.geereemed.com/col.jsp?id=123"}}, {"name": "智蜂创元", "href": "research-profile-b0eb2bb7808aaf104960.html", "claim": "精密插拔场景提供可量化的具身智能验证入口。价值不在通用演示，而在多批零件偏差下的节拍、良率、损伤率及换线成本；数据闭环若不能降低重复部署的人力投入，仍可能是重集成项目。", "question": "视触融合能否在可复制的交付成本下稳定达到客户产线节拍与良率？", "source": {"title": "冯源资本投资组合：智蜂创元（展开详情）", "url": "https://www.fy-capital.cn/index/portfolio/index"}}, {"name": "智谱 / Z.ai", "href": "research-profile-77626ebfb7bf5e31a5f0.html", "claim": "ARC 将可验证任务结果用于 RL 与自蒸馏迭代；它把“完成任务”连接到训练信号，而不只是工具调用。", "question": "固定墙钟、预算与脚手架后，后训练提升能否降低每个无回滚交付的全成本？", "source": {"title": "GLM-4.5 ARC 技术论文 · v1", "url": "https://arxiv.org/html/2508.06471"}}, {"name": "月之暗面 / Moonshot AI", "href": "research-profile-cc40f6b54738b8cf861f.html", "claim": "月之暗面的投资研究应拆分模型能力、Agent编排及终端产品留存。以K2.5历史技术样本观察多模态与并行执行的经济性，不把模型榜单、开源热度或任务数量直接推算为付费收入。", "question": "新模型提升能否在具体产品接口转成更低的合格交付成本？", "source": {"title": "Kimi K2.5技术报告v2", "url": "https://arxiv.org/abs/2602.02276"}}, {"name": "未知君", "href": "research-profile-8a996d56d1ef38ce9355.html", "claim": "未知君将既有百图生科研究延伸至微生态应用场景：菌株资源、宿主反应与培养工艺数据可能构成领域优势，但食品益生菌、科研服务和活菌药物的监管及商业化路径不同。应验证基础模型合作是否产生可重复的菌株筛选和工艺收益，而非把战略协议、数据库规模或平台闭环直接当盈利与临床价值。", "question": "上游模型合作和下游渠道协议，分别转成多少可验证研发收益与回款？", "source": {"title": "未知君与百图生科战略合作公告", "url": "https://www.xbiome.com/press-releases/182"}}, {"name": "来也 / Laiye", "href": "research-profile-224182ce3d9693f4eb79.html", "claim": "与影刀、达观共同构成企业执行型AI对标：关键不在新增聊天入口，而在跨系统完成业务任务、异常恢复和治理成本。应把传统自动化客户与新智能体付费采用分开，评估技能复用能否减少每客定制交付。", "question": "从RPA技能到长期运行智能体，是否形成可复用且盈利的交付？", "source": {"title": "Laiye企业智能体与自动化平台官网", "url": "https://laiye.com/en"}}, {"name": "松灵机器人 / AgileX", "href": "research-profile-4880b32c98d209ec7244.html", "claim": "松灵可与睿尔曼、穹彻及刻行对照具身数据链：底盘和采集硬件降低搭建门槛，但规模化采集的价值取决于有效轨迹成本、时间同步和跨本体迁移，而不是设备数量。研究应拆开硬件销售、采集服务与数据软件收入，避免把工具链闭环当成递归自我改进。", "question": "一体化采集套件是否降低每条可训练轨迹成本并改善真实任务表现？", "source": {"title": "松灵官方Pika数据采集方案", "url": "https://www.agilex.ai/page/690ac4905e78cfa260412ca1"}}, {"name": "梅卡曼德 / Mech-Mind", "href": "research-profile-7f9748444d03269c3dee.html", "claim": "工业视觉积累可为具身操作提供成像、标定与集成基础，但成熟工业收入不能自动证明通用人形方案的经济性。需分开检验视觉硬件竞争力、软件付费以及新任务泛化成本。", "question": "新工件换型成本和软件复购是否可规模化？", "source": {"title": "梅卡曼德官网", "url": "https://www.mech-mind.com.cn/"}}, {"name": "森亿智能 / Synyi", "href": "research-profile-bb392e5eb8585d8e7538.html", "claim": "森亿补充院内数据治理与AI应用视角，可与达观、来也比较垂直流程集成，与AI4S研究区分临床数据工具和药物/细胞模型。医疗知识和系统接入可能提高替换成本，但项目制交付、院内数据权限和回款周期会影响软件利润；流程提效不能自动推导临床结局改善。", "question": "院内数据与临床工作流优势能否转化为可复用的AI付费产品？", "source": {"title": "森亿智能官方产品与场景概览", "url": "https://www.synyi.com/"}}, {"name": "水木分子", "href": "research-profile-80eb4e22e188d74ab120.html", "claim": "水木分子连接AI4S研发与AI应用工作流：与德睿智药比较，应拆分自研药物资产和ChatDD软件服务的价值。专业工具调用与专家反馈可提高研究效率，但人机协作不自动等于模型权重自我更新或递归自我改进；需核实验反馈是否改善未见任务表现，而非仅修改当次候选。", "question": "ChatDD的工作流效率与自研管线成效能否分别验证并形成可复制收入？", "source": {"title": "水木分子官方ChatDD与自研管线介绍", "url": "https://www.pharmolix.com/zh"}}, {"name": "汇医慧影", "href": "research-profile-3d2d405d25374c6eed6b.html", "claim": "汇医慧影与森亿、数坤提供数据平台到临床AI的国内对照。影像数据治理可能降低新算法接入成本，但影像云、科研工具与诊疗产品的买单方、预算与监管边界不同；应分别核付费、复用率和交付成本，不能把数据汇聚闭环直接当作模型持续提升或临床价值已证实。", "question": "影像数据平台是否真正带动可复用AI产品销售，而非形成多条项目交付业务？", "source": {"title": "汇医慧影官方影像AI与数据平台介绍", "url": "https://www.huiyihuiying.com/"}}, {"name": "泛函数 / xfunc", "href": "research-profile-b3c73713a529200a7587.html", "claim": "AI芯片设计工具与工程服务的交叉平台。价值应按真实设计在相同工艺、约束和算力下的PPA     hit.classList.add('here');
    count.textContent=(current+1)+' / '+hits.length;
    hit.scrollIntoView({block:'center',behavior:'instant'});
  }
  function find() {
    clear();
    const q=input.value.trim().toLowerCase();
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    if(q) while(walker.nextNode()) {
      const node=walker.currentNode;
      if(!node.parentElement.closest('script,style,textarea,input,select,button,[hidden],[aria-hidden="true"]') && node.data.toLowerCase().includes(q)) nodes.push(node);
    }
    for(const node of nodes){
      const text=node.data, lower=text.toLowerCase(), frag=document.createDocumentFragment();
      let start=0, at;
      while((at=lower.indexOf(q,start))!==-1){
        frag.append(text.slice(start,at));
        const mark=document.createElement('mark');
        mark.className='local-hit';mark.textContent=text.slice(at,at+q.length);
        frag.append(mark);hits.push(mark);start=at+q.length;
      }
      frag.append(text.slice(start));node.replaceWith(frag);
    }
    prev.disabled=next.disabled=hits.length<2;
    count.textContent=q?'本页无匹配':'';
    go(0);
  }
  function show(open) {
    bar.hidden=!open;toggle.setAttribute('aria-expanded',String(open));
    if(open) input.focus();
    else {clear();input.value='';count.textContent='';toggle.focus({preventScroll:true});}
  }
  toggle.onclick=()=>show(bar.hidden);
  close.onclick=()=>show(false);
  prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);
  input.oninput=e=>{if(!e.isComposing)find()};
  input.addEventListener('compositionend',find);
  input.onkeydown=e=>{if(!e.isComposing && e.key==='Enter'){e.preventDefault();go(current+(e.shiftKey?-1:1))}};
  document.addEventListener('keydown',e=>{if(!bar.hidden && e.key==='Escape') show(false)});
})();
</script></body></html>
