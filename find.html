<title>全站搜索 · 观势</title><style>:root {
  --paper: #f8f7f1;
  --ink: #172e26;

* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 1320px; padding: 0 clamp(20px, 6vw, 88px) 70px; }
a { color: inherit; text-decoration: none; text-underline-offset: .22em; }
a:hover { color: var(--green); text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
::selection { background: #d1e6cb; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 12px; font: 600 26px var(--serif); }
.mark { background: var(--ink); color: var(--paper); padding: 6px 8px; font-size: 22px; line-height: 1; border-radius: 3px; }
nav { display: flex; gap: clamp(10px, 2vw, 32px); }
nav a { padding: 10px 0 6px; border-bottom: 2px solid transparent; font-size: 14px; }
nav a[aria-current] { border-color: var(--green); font-weight: 600; }
.hero { position: relative; isolation: isolate; overflow: hidden; padding: clamp(36px, 6vw, 78px) 0; border-bottom: 3px double var(--ink); }
h1, h2, h3, p { margin: 0; }
h1 { font: 500 clamp(35px, 5.7vw, 78px)/1.18 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.hero p { color: var(--muted); margin-bottom: 12px; font-size: 14px; }
.cover h1 { letter-spacing: .05em; }
.day { display: grid; grid-template-columns: minmax(120px, 1fr) 4fr; gap: 20px; padding-top: 28px; }
.day h2 { font: 500 30px/1.3 Georgia, var(--serif); font-variant-numeric: tabular-nums; }
.day h2 small { display: block; font: 14px/1.6 Georgia, serif; color: var(--muted); }
.entry { padding: 17px 0 22px; border-bottom: 1px solid var(--line); }
.entry:first-child { padding-top: 0; }
.entry a, .directory a { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
.entry a::after, .directory a::after { content: '↗'; color: var(--green); font: 18px Georgia, serif; }
.entry h3 { font: 500 clamp(22px, 2.4vw, 34px)/1.5 var(--serif); }
.directory { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 44px; }
.directory a { padding: 18px 0; border-bottom: 1px solid var(--line); font: 500 22px/1.6 var(--serif); }
.details, .intro { max-width: 800px; }
.details div { display: grid; grid-template-columns: 8em 1fr; gap: 1rem; padding: 19px 0; border-bottom: 1px solid var(--line); }
dt { color: var(--muted); } dd { margin: 0; }
.details a { color: var(--green); text-decoration: underline; }
.intro { padding: 24px 0 0; }
@media(max-width:640px) {
  .top { gap: 8px; padding: 12px 0; }
  .brand { gap: 6px; font-size: 21px; }
  .mark { font-size: 18px; }

  .day { grid-template-columns: 1fr; gap: 14px; }
  .day h2 { font-size: 21px; } .day h2 small { display:inline; margin-right:8px; }
  .directory { grid-template-columns: 1fr; }
  .details div { grid-template-columns: 5em 1fr; }
  .cover h1 { max-width: 74%; }
}
:root { --paper:#f6f3eb; --ink:#182e28; --accent:#954c36; }

.dispatch h3 { font:500 clamp(27px,3.5vw,48px)/1.3 var(--serif); }

.holdings { margin-top:36px; }
.holdings>h2 { font:500 17px var(--serif); color:var(--accent); }

@media(max-width:640px) {

:root { --paper:#f3f4ed; --ink:#131c1c; --green:#2547aa; --accent:#2547aa; --line:#c8cfc4; --serif:"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif; }
body { max-width:1520px; padding-inline:clamp(16px,4vw,64px); }

.atlas { position:relative; display:flex; align-items:stretch; gap:0; flex-wrap:wrap; min-inline-size:0; padding:0; margin:0; border:0; background:#182eb4; color:#f2f6ed; }
.atlas legend,.switch { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; }

.subject p { font-size:16px; }
.atlas a:hover { color:#d4ff70; }
.atlas a:focus-visible { outline-color:#d4ff70; }
.folio { font-family:Arial,sans-serif; font-weight:600; }
.dispatch h3 { font-weight:600; }

 .top {padding:13px 0;} .brand { font-size:24px; } .wordmark {font-size:9px;} .cover {padding:20px 0 12px;}

 · 2026-11-23"],["广州健康产投私募基金管理有限公司","机构档案","institution-5462e35f03494b0c6351.html","机构档案 收录被投公司 1 家 收录融资事件 1 笔 参投记录 披露于 2026-11-23 瑞莱谱 瑞莱谱完成新一轮融资 查看融资详情 → 投资布局 检索样本中按机构名称精确匹配的融资记录 医疗健康 · B++轮 · 2 项 瑞莱谱 · 2026-11-23 瑞莱谱（杭州）医疗科技有限公司 · 2026-11-20"],["广州市白云投资基金管理有限公司","机构档案","institution-b0901132f730add29dc7.html","机构档案 收录被投公司 1 家 收录融资事件 1 笔 参投记录 披露于 2026-11-23 瑞莱谱 瑞莱谱完成新一轮融资 查看融资详情 → 投资布局 检索样本中按机构名称精确匹配的融资记录 医疗健康 · B++轮 · 2 项 瑞莱谱 · 2026-11-23 瑞莱谱（杭州）医疗科技有限公司 · 2026-11-20"]]</script><script>(() => {
  const input = document.querySelector('#lookup');
  const list = document.querySelector('#found');
  const status = document.querySelector('#found-count');
  const more = document.querySelector('#show-more');
  const normalize = value => value.normalize('NFKC').toLowerCase();
  const rows = JSON.parse(document.querySelector('#lookup-index').textContent)
    .map(([title, kind, url, text]) => ({title, kind, url, name:normalize(title), text:normalize(text)}));
  input.value = new URLSearchParams(location.search).get('q') || '';
  let limit = 20;
  function draw() {
    const query = input.value.trim();
    const words = normalize(query).split(/\s+/).filter(Boolean);
    const matches = words.length ? rows.filter(row => words.every(word=>
      row.name.includes(word) || row.kind.includes(word) || row.text.includes(word)))
      .sort((a,b)=>Number(b.name===normalize(query))-Number(a.name===normalize(query)) ||
        Number(b.name.includes(words[0]))-Number(a.name.includes(words[0]))) : [];
    list.replaceChildren();
    for (const row of matches.slice(0,limit)) {
      const a=document.createElement('a');
      a.href=row.url;
      const label=document.createElement('small');label.textContent=row.kind;
      const title=document.createElement('strong');title.textContent=row.title;
      a.append(label,title);list.append(a);
    }
    status.textContent=words.length ? (matches.length ? matches.length+' 条结果' : '没有找到，可试试公司简称或赛道名。') : '';
    more.hidden=matches.length<=limit;
    const params=new URLSearchParams();
    if(query)params.set('q',query);
    history.replaceState(null,'','find.html'+(query?'?'+params:''));
  }
  input.addEventListener('input',e=>{if(!e.isComposing){limit=20;draw()}});
  input.addEventListener('compositionend',()=>{limit=20;draw()});
  input.form.addEventListener('submit',e=>{e.preventDefault();draw()});
  more.onclick=()=>{limit+=20;draw()};
  draw();
})();
</script><section class="arc"><div class="arc-track" tabindex="0" aria-label="浏览栏目，左右滑动"><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>融资事件</strong><b></b></button></div><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>公司档案</strong><b></b></button></div><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>机构档案</strong><b></b></button></div><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>研究周报</strong><b></b></button></div><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>赛道画布</strong><b></b></button></div><div class="arc-slot"><button class="arc-card"><small>浏览栏目</small><strong>变化追踪</strong><b></b></button></div></div><div class="arc-bottom"><div><article class="arc-record" hidden><h2><a href="index.html">融资事件 →</a></h2></article><article class="arc-record" hidden><h2><a href="companies.html">公司档案 →</a></h2></article><article class="arc-record" hidden><h2><a href="institutions.html">机构档案 →</a></h2></article><article class="arc-record" hidden><h2><a href="reports.html">研究周报 →</a></h2></article><article class="arc-record" hidden><h2><a href="landscape.html">赛道画布 →</a></h2></article><article class="arc-record" hidden><h2><a href="changes.html">变化追踪 →</a></h2></article></div><div class="arc-controls"><button aria-label="上一分类">‹</button><output></output><button aria-label="下一分类">›</button></div></div></section><script defer src="shelf.js"></script></main><script>(() => {
  const toggle = document.querySelector('#local-toggle');
  const bar = document.querySelector('#local-find');
  const input = bar.querySelector('input');
  const [prev,next,close] = bar.querySelectorAll('button');
  const count = bar.querySelector('output');
  const root = document.querySelector('main');
  let hits = [], current = -1, opened = [];
  function clear() {
    for (const mark of hits) {
      const parent = mark.parentNode;
      if (parent) {mark.replaceWith(document.createTextNode(mark.textContent));parent.normalize();}
    }
    hits = []; current = -1;
    for (const box of opened) box.open = false;
    opened = [];
  }
  function go(index) {
    if (!hits.length) return;
    if (current >= 0) hits[current].classList.remove('here');
    current = (index + hits.length) % hits.length;
    const hit = hits[current];
    for (let el=hit.parentElement;el && el!==root;el=el.parentElement) {
      if(el.tagName==='DETAILS' && !el.open){el.open=true;opened.push(el);}
    }
    hit.classList.add('here');
    count.textContent=(current+1)+' / '+hits.length;
    hit.scrollIntoView({block:'center',behavior:'instant'});
  }
  function find() {
    clear();
    const q=input.value.trim().toLowerCase();
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    if(q) while(walker.nextNode()) {
      const node=walker.currentNode;
      if(!node.parentElement.closest('script,style,textarea,input,select,button,[hidden],[aria-hidden="true"]') && node.data.toLowerCase().includes(q)) nodes.push(node);
    }
    for(const node of nodes){
      const text=node.data, lower=text.toLowerCase(), frag=document.createDocumentFragment();
      let start=0, at;
      while((at=lower.indexOf(q,start))!==-1){
        frag.append(text.slice(start,at));
        const mark=document.createElement('mark');
        mark.className='local-hit';mark.textContent=text.slice(at,at+q.length);
        frag.append(mark);hits.push(mark);start=at+q.length;
      }
      frag.append(text.slice(start));node.replaceWith(frag);
    }
    prev.disabled=next.disabled=hits.length<2;
    count.textContent=q?'本页无匹配':'';
    go(0);
  }
  function show(open) {
    bar.hidden=!open;toggle.setAttribute('aria-expanded',String(open));
    if(open) input.focus();
    else {clear();input.value='';count.textContent='';toggle.focus({preventScroll:true});}
  }
  toggle.onclick=()=>show(bar.hidden);
  close.onclick=()=>show(false);
  prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);
  input.oninput=e=>{if(!e.isComposing)find()};
  input.addEventListener('compositionend',find);
  input.onkeydown=e=>{if(!e.isComposing && e.key==='Enter'){e.preventDefault();go(current+(e.shiftKey?-1:1))}};
  document.addEventListener('keydown',e=>{if(!bar.hidden && e.key==='Escape') show(false)});
})();
</script></body></html>
