<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>森木磊石 · 观势</title><style>:root {
  --paper: #f8f7f1;
  --ink: #172e26;
  --green: #30624e;
  --muted: #58645c;
  --line: #c9cec3;
  --serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, Georgia, serif;
  font: 16px/1.65 "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 1320px; padding: 0 clamp(20px, 6vw, 88px) 70px; }
a { color: inherit; text-decoration: none; text-underline-offset: .22em; }
a:hover { color: var(--green); text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
::selection { background: #d1e6cb; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 12px; font: 600 26px var(--serif); }
.mark { background: var(--ink); color: var(--paper); padding: 6px 8px; font-size: 22px; line-height: 1; border-radius: 3px; }
nav { display: flex; gap: clamp(10px, 2vw, 32px); }
nav a { padding: 10px 0 6px; border-bottom: 2px solid transparent; font-size: 14px; }
nav a[aria-current] { border-color: var(--green); font-weight: 600; }
.hero { position: relative; isolation: isolate; overflow: hidden; padding: clamp(36px, 6vw, 78px) 0; border-bottom: 3px double var(--ink); }
h1, h2, h3, p { margin: 0; }
h1 { font: 500 clamp(35px, 5.7vw, 78px)/1.18 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.hero p { color: var(--muted); margin-bottom: 12px; font-size: 14px; }
.cover h1 { letter-spacing: .05em; }
.day { display: grid; grid-template-columns: minmax(120px, 1fr) 4fr; gap: 20px; padding-top: 28px; }
.day h2 { font: 500 30px/1.3 Georgia, var(--serif); font-variant-numeric: tabular-nums; }
.day h2 small { display: block; font: 14px/1.6 Georgia, serif; color: var(--muted); }
.entry { padding: 17px 0 22px; border-bottom: 1px solid var(--line); }
.entry:first-child { padding-top: 0; }
.entry a, .directory a { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
.entry a::after, .directory a::after { content: '↗'; color: var(--green); font: 18px Georgia, serif; }
.entry h3 { font: 500 clamp(22px, 2.4vw, 34px)/1.5 var(--serif); }
.directory { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 44px; }
.directory a { padding: 18px 0; border-bottom: 1px solid var(--line); font: 500 22px/1.6 var(--serif); }
.details, .intro { max-width: 800px; }
.details div { display: grid; grid-template-columns: 8em 1fr; gap: 1rem; padding: 19px 0; border-bottom: 1px solid var(--line); }
dt { color: var(--muted); } dd { margin: 0; }
.details a { color: var(--green); text-decoration: underline; }
.intro { padding: 24px 0 0; }
@media(max-width:640px) {
  .top { gap: 8px; padding: 12px 0; }
  .brand { gap: 6px; font-size: 21px; }
  .mark { font-size: 18px; }
  nav { gap: 9px; } nav a { font-size: 13px; padding: 12px 0; }
  .day { grid-template-columns: 1fr; gap: 14px; }
  .day h2 { font-size: 21px; } .day h2 small { display:inline; margin-right:8px; }
  .directory { grid-template-columns: 1fr; }
  .details div { grid-template-columns: 5em 1fr; }
  .cover h1 { max-width: 74%; }
}
:root { --paper:#f6f3eb; --ink:#182e28; --accent:#954c36; }
.cover { padding:24px 0 16px; border-bottom:1px solid var(--ink); }
.cover h1 { font:500 20px/1.5 var(--serif); letter-spacing:.06em; }
.edition { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:5%; padding:34px 0 40px; }
.folio { font:normal clamp(48px,7vw,100px)/1 Georgia,serif; letter-spacing:-.045em; }
.folio small { display:block; font:18px/2 Georgia,serif; letter-spacing:.14em; }
.folio em { font-weight:normal; color:var(--accent); margin:0 .04em; }
.dispatch { border-top:1px solid var(--line); padding:18px 0; }
.dispatch:first-child { border:0; padding-top:0; }
.dispatch h3 { font:500 clamp(27px,3.5vw,48px)/1.3 var(--serif); }
.dispatch h3 span { display:block; margin-top:4px; font:400 clamp(17px,1.6vw,22px)/1.5 var(--serif); }
.dispatch p { color:var(--muted); font-size:13px; margin-top:8px; }
.holdings { margin-top:36px; }
.holdings>h2 { font:500 17px var(--serif); color:var(--accent); }
.holding { display:flex; align-items:baseline; justify-content:space-between; gap:20px; border-top:1px solid var(--line); margin-top:14px; padding:18px 0; }
.holding h2 { font:500 34px var(--serif); }
.holding small { font:15px Georgia,serif; color:var(--muted); }
.holding>a { text-decoration:underline; }
@media(max-width:640px) {
  .edition { display:block; padding:20px 0; }
  .folio { font-size:52px; padding-bottom:16px; border-bottom:1px solid var(--ink); }
  .folio small { display:inline; margin-right:12px; font-size:14px; }
  .dispatch:first-child { padding-top:18px; }
  .holding { display:block; } .holding>a { display:inline-block; margin-top:12px; }
}
:root { --paper:#f3f4ed; --ink:#131c1c; --green:#2547aa; --accent:#2547aa; --line:#c8cfc4; --serif:"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif; }
body { max-width:1520px; padding-inline:clamp(16px,4vw,64px); }
.top { padding:20px 0; }
.brand { gap:9px; font:bold 28px/1 var(--serif); letter-spacing:-.05em; }
.wordmark { font:bold 12px/1 Arial,sans-serif; letter-spacing:.03em; }
.hero h1 { font-weight:650; letter-spacing:-.035em; }
.cover { border:0; padding:26px 0 14px; }
.cover h1 { font:600 24px/1.3 var(--serif); }
.atlas { position:relative; display:flex; align-items:stretch; gap:0; flex-wrap:wrap; min-inline-size:0; padding:0; margin:0; border:0; background:#182eb4; color:#f2f6ed; }
.atlas legend,.switch { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; }
.atlas label { order:2; cursor:pointer; padding:12px 18px; font-size:14px; color:#e7eafa; border-top:1px solid #ffffff55; flex:auto; text-align:center; }
.switch:checked + label { background:#d4ff70; color:#122427; }
.switch:focus-visible + label { outline:3px solid #ffb13c; outline-offset:-4px; }
.plate { display:none; order:1; flex-basis:100%; min-width:0; align-items:center; padding:clamp(22px,3vw,52px); gap:3%; }
.switch:checked + label + .plate { display:grid; grid-template-columns:minmax(0, .95fr) minmax(0,1.5fr); }
.subject h2 { font:650 clamp(46px,6vw,90px)/1.1 var(--serif); letter-spacing:-.055em; overflow-wrap:anywhere; margin:26px 0 16px; }
.subject small { font:13px/1.4 var(--serif); letter-spacing:.08em; }
.subject p { font-size:16px; }
.atlas a:hover { color:#d4ff70; }
.atlas a:focus-visible { outline-color:#d4ff70; }
.weave { display:grid; grid-template-columns:minmax(0,1fr) minmax(74px,.7fr); align-items:stretch; }
.weave svg { width:100%; height:clamp(230px,23vw,340px); overflow:hidden; }
.weave path { fill:none; stroke:#d4ff70; stroke-width:.8; vector-effect:non-scaling-stroke; }
.ends { display:flex; flex-direction:column; justify-content:space-around; }
.ends a { font-size:clamp(12px,1.1vw,16px); padding-left:10px; line-height:1.35; border-left:2px solid #d4ff70; }
@media(prefers-reduced-motion:no-preference) { .switch:checked + label + .plate .weave svg { animation:reveal .45s ease-out both; } @keyframes reveal { from {clip-path:inset(0 22% 0 0)} to {clip-path:inset(0)} } }
.folio { font-family:Arial,sans-serif; font-weight:600; }
.dispatch h3 { font-weight:600; }
@media(max-width:640px) {
 .top {padding:13px 0;} .brand { font-size:24px; } .wordmark {font-size:9px;} .cover {padding:20px 0 12px;}
 .switch:checked + label + .plate {grid-template-columns:1fr;} .plate {padding:21px 20px 12px;}
 .subject h2 {font-size:46px;margin:10px 0 5px;} .subject p {font-size:14px;}
 .weave svg {height:130px;} .atlas label {font-size:12px;padding:12px 4px;}
 .hero:not(.cover) {padding:34px 0;} .weave {grid-template-columns:1.65fr 1fr;}
}
</style></head>
