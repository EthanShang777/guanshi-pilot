<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>弘晖基金 · 观势</title><style>/* Frosted editorial surfaces. Green marks state, never a research conclusion. */
:root {
  --canvas: #f2f5f4;
  --canvas-depth: #cbeada;
  --surface: #ffffff;
  --glass-fallback: #fafcfb;
  --glass-min-opacity: .62;
  --content-min-opacity: .84;
  --reading-opacity: .97;
  --surface-subtle: #f2f4f2;
  --ink: #171c19;
  --body: #404a44;
  --muted: #56635a;
  --line: #dce2dd;
  --line-strong: #b7c2b9;
  --green: #b8f3c3;
  --green-soft: #eaf8ed;
  --green-ink: #245c39;
  --focus: #267444;
  --radius-card: 22px;
  --radius-control: 12px;
  --shadow-glass: 0 6px 18px #193c260d, 0 1px 3px #193c2605, inset 0 1px 0 #ffffff, inset 0 -1px 0 #193c2605;
  --shadow-content: 0 4px 14px #193c2608, 0 1px 2px #193c2604, inset 0 1px 0 #ffffff;
  font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--ink);
  background: var(--canvas);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 460px 290px at 86% 200px, var(--canvas-depth), #e4f2eb00 76%),
    radial-gradient(ellipse 1000px 700px at 60% 75%, #edf1f2, #edf1f200 74%),
    linear-gradient(135deg, #f9fbfb, var(--canvas) 60%, #f7f9f9);
  background-attachment: fixed;
}
button, input, select { font: inherit; }
button, a, select { touch-action: manipulation; }
button { cursor: pointer; background: none; border: 0; color: inherit; }
a { color: var(--green-ink); text-decoration: none; text-underline-offset: 3px; }
a:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
summary:focus-visible, .ledger-wrap:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
}
::selection { background: var(--green); color: var(--ink); }
.app-shell { min-height: 100vh; }

/* Existing library navigation, with a frosted rail rather than a new container. */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 200px;
  background: var(--surface); color: var(--body);
  border-right: 1px solid var(--line);
  padding: 30px 20px 20px; display: flex; flex-direction: column;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 600; font-size: 21px; letter-spacing: -.02em; }
.brand:hover { text-decoration: none; }
.brandmark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; background: linear-gradient(145deg, #d9ffe1, var(--green)); border: 1px solid #ffffffc9; border-radius: 13px; box-shadow: 0 4px 12px #24733b14, inset 0 1px 0 #ffffffb3; font-size: 23px; font-weight: 400; color: var(--ink); }
.brand-sub { display: block; font-size: 12px; letter-spacing: .1em; font-weight: 400; color: var(--muted); margin-top: 6px; }
.private-label { font-size: 12px; margin: 20px 0 24px; padding-left: 3px; color: var(--muted); }
.private-label::before { content: ''; display: inline-block; width: 5px; height: 5px; background: var(--focus); border-radius: 50%; margin: 0 8px 2px 0; }
.nav-caption { font-size: 12px; color: var(--muted); letter-spacing: .12em; margin: 0 12px 12px; }
.primary-nav + .nav-caption { margin-top: 16px; }
.topic-button { width: 100%; min-height: 44px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; border-radius: var(--radius-control); font-size: 14px; text-align: left; margin: 2px 0; }
.topic-button:hover { background: var(--surface-subtle); color: var(--ink); }
.topic-button.active { background: var(--ink); color: var(--surface); box-shadow: none; }
.topic-button em { font-size: 12px; font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 10px; }
.topic-button small { font-size: 11px; color: var(--muted); }
.topic-button.active em, .topic-button.active small { color: var(--green); }
.sidebar-note { margin-top: auto; border-top: 1px solid var(--line); padding: 18px 10px 0; font-size: 12px; line-height: 1.85; color: var(--muted); }
.sidebar-note strong { font-weight: 500; color: var(--ink); }
.sidebar-note p { margin: 8px 0 12px; }
.sidebar-note span { font-size: 12px; }

main { margin-left: 200px; padding: 38px 48px 0; max-width: 1800px; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; position: relative; isolation: isolate; }
/* A small, non-interactive wash, not an added card or new piece of content. */
.topbar::before { content: ''; position: absolute; z-index: -1; pointer-events: none; width: 280px; height: 170px; right: 16px; top: -38px; background: radial-gradient(ellipse, #bcebd740, #e4f2eb00 72%); }
.eyebrow { font-size: 12px; letter-spacing: .13em; color: var(--muted); font-weight: 500; }
.topbar .eyebrow { font-size: 13px; font-style: italic; letter-spacing: .09em; color: var(--body); }
h1 { font-size: clamp(32px, 3.1vw, 46px); font-weight: 450; letter-spacing: -.025em; line-height: 1.3; margin: 8px 0 0; }
.week-control { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
select, input { border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); padding: 11px 13px; font-size: 14px; min-height: 44px; box-shadow: inset 0 1px 0 #ffffff, 0 2px 5px #193c2605; }
input::placeholder { color: var(--muted); opacity: 1; }
select { max-width: 100%; }
.week-control select { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.period-line { margin: 18px 0 24px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; gap: 15px; line-height: 1.7; font-variant-numeric: tabular-nums; }
.tabs { display: flex; border-bottom: 1px solid var(--line); gap: 8px; margin-bottom: 24px; padding-bottom: 10px; }
.tabs button { position: relative; min-height: 40px; padding: 10px 16px; border-radius: var(--radius-control); font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs button:hover { color: var(--ink); background: var(--surface-subtle); }
.tabs button.selected { font-weight: 500; color: var(--surface); background: var(--ink); box-shadow: none; }
.tabs small { display: inline-block; color: var(--muted); background: var(--surface-subtle); border-radius: 2px; padding: 1px 5px; font-size: 11px; line-height: 1.4; margin-left: 8px; font-variant-numeric: tabular-nums; }
.tabs button.selected small { background: var(--green); color: var(--ink); }

/* The same four figures and six-topic grid, with a more editorial hierarchy. */
.metrics { display: grid; grid-template-columns: repeat(4,1fr); background: var(--surface); margin-bottom: 28px; padding: 24px 0; }
.metrics > div { padding: 0 26px; border-right: 1px solid var(--line); }
.metrics > div:last-child { border: 0; }
.metrics span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 13px; }
.metrics strong { font-size: 40px; font-weight: 400; font-style: italic; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.metrics small { font-size: 12px; font-style: normal; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-left: 3px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 26px 0 18px; }
.section-heading h2 { font-size: 20px; font-weight: 500; letter-spacing: -.025em; margin: 0; }
.section-heading > span, .section-heading p { font-size: 12px; color: var(--muted); margin: 7px 0 0; line-height: 1.7; }
.report-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; }
.report-card { background: var(--surface); padding: 24px 24px 18px; display: flex; flex-direction: column; min-width: 0; }
.report-card:hover { box-shadow: 0 6px 18px #193c2610, 0 1px 3px #193c2606, inset 0 1px 0 #ffffff; }
.card-top { display: flex; justify-content: space-between; align-items: center; }
.index { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
.status { font-size: 12px; background: var(--green-soft); color: var(--green-ink); border-radius: 7px; padding: 3px 7px; }
.report-card h3 { font-size: 24px; letter-spacing: -.025em; font-weight: 500; line-height: 1.4; margin: 18px 0 6px; }
.hint { font-size: 12px; color: var(--muted); }
.report-card p { font-size: 14px; line-height: 1.85; color: var(--body); margin: 19px 0 26px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; font-size: 12px; color: var(--muted); }
.card-bottom button { font-size: 13px; font-weight: 500; color: var(--ink); padding: 7px 0 7px 7px; }
.card-bottom button:hover { color: var(--green-ink); text-decoration: underline; text-underline-offset: 4px; }

nav{margin-top:28px}.report-card{border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow-content);max-width:760px}.report-card p{display:block}.card-bottom{flex-wrap:wrap}.report-card .card-bottom a{padding:10px 0}main{padding-bottom:32px}.topbar{overflow:hidden}
