name: Verify financing database access
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token and D1 access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.error import HTTPError
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4/"+path, headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)["result"]
              except HTTPError as e:
                  raise SystemExit(f"Cloudflare returned HTTP {e.code} for {path.split('/')[0]}")
          if get("user/tokens/verify")["status"] != "active":
              raise SystemExit("Token inactive")
          print("Token active", flush=True)
          account = os.environ["ACCOUNT"]
          if not account:
              accounts = get("accounts")
              if len(accounts) != 1:
                  raise SystemExit("Set CLOUDFLARE_ACCOUNT_ID to identify the target account")
              account = accounts[0]["id"]
          get(f"accounts/{account}/d1/database?per_page=1")
          print("D1 listing verified")
          PY
