name: Verify financing database access
on:
  push:
    branches: [main]
    paths: ['d1-readback-request.json']
  workflow_dispatch:
    inputs:
      request:
        description: Strict JSON readback request with batch, keys and scope digest
        type: string
        required: true
permissions: {}
concurrency:
  group: daily-financing
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: github.repository == 'EthanShang777/guanshi-pilot' && github.ref == 'refs/heads/main' && github.actor_id == '110958536'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify fixed production readback
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          """Fixed, bounded D1 readback. No SQL or database identifiers from callers."""
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          from collections import Counter

          REPO = 'EthanShang777/guanshi-pilot'
          MANIFEST = 'd1-readback-request.json'
          HEX40 = r'[0-9a-f]{40}'
          HEX64 = r'[0-9a-f]{64}'
          EVENT = r'(?:public:historical-disclosure:[0-9a-f]{22}|financing_event:[0-9a-f]{64})'
          COMPANY = r'co:full_legal_name:[0-9a-f]{32}'
          KINDS = {'fund', 'lp', 'stat', 'allocation', 'coverage', 'deal_link'}


          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'),
                                              ensure_ascii=True, allow_nan=False).encode()).hexdigest()


          def exact(value, pattern):
              if not isinstance(value, str) or re.fullmatch(pattern, value) is None:
                  raise ValueError('Invalid key')


          def unique_object(pairs):
              obj = {}
              for key, value in pairs:
                  if key in obj:
                      raise ValueError('Duplicate JSON key')
                  obj[key] = value
              return obj


          def parse_request(raw, base_sha):
              if not isinstance(raw, str) or len(raw.encode()) > 8192:
                  raise ValueError('Invalid request size')
              obj = json.loads(raw, object_pairs_hook=unique_object,
                               parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Invalid JSON number')))
              fields = {'version', 'batch', 'base_main_sha', 'candidate_sha256', 'scope_sha256',
                        'batch_digests', 'fund_ids', 'event_ids', 'company_windows'}
              if not isinstance(obj, dict) or set(obj) != fields:
                  raise ValueError('Invalid request fields')
              if type(obj['version']) is not int or obj['version'] != 1:
                  raise ValueError('Invalid schema version')
              if type(obj['batch']) is not int or not 1 <= obj['batch'] <= 999999:
                  raise ValueError('Invalid batch')
              exact(obj['base_main_sha'], HEX40)
              exact(obj['candidate_sha256'], HEX64)
              exact(obj['scope_sha256'], HEX64)
              if obj['base_main_sha'] != base_sha:
                  raise ValueError('Base main changed')
              if digest({k: v for k, v in obj.items() if k != 'scope_sha256'}) != obj['scope_sha256']:
                  raise ValueError('Scope digest mismatch')
              for key, pattern, maximum in [('batch_digests', HEX64, 4),
                                            ('fund_ids', r'[0-9a-f]{24}', 4), ('event_ids', EVENT, 16)]:
                  values = obj[key]
                  if not isinstance(values, list) or len(values) > maximum:
                      raise ValueError('Invalid key list')
                  for value in values:
                      exact(value, pattern)
                  if len(set(values)) != len(values):
                      raise ValueError('Duplicate request key')
              windows = obj['company_windows']
              if not isinstance(windows, list) or len(windows) > 8:
                  raise ValueError('Invalid window list')
              seen = set()
              for window in windows:
                  if not isinstance(window, dict) or set(window) != {'company_id', 'day'}:
                      raise ValueError('Invalid window fields')
                  exact(window['company_id'], COMPANY)
                  exact(window['day'], r'(?:19|20)[0-9]{2}-[0-9]{2}-[0-9]{2}')
                  dt.date.fromisoformat(window['day'])
                  key = (window['company_id'], window['day'])
                  if key in seen:
                      raise ValueError('Duplicate window')
                  seen.add(key)
              if not any(obj[k] for k in ('batch_digests', 'fund_ids', 'event_ids', 'company_windows')):
                  raise ValueError('Empty scope')
              return obj


          def queries(scope):
              out = []
              def add(name, key, sql, params, maximum):
                  out.append(dict(template=name, key_sha256=digest(key), sql=sql,
                                  params=params, maximum=maximum))
              for key in scope['batch_digests']:
                  add('batch_digest', key,
                      'SELECT digest,filename,rows_added,sources_linked,rows_held,processed_at FROM historical_financing_batches WHERE digest=? ORDER BY digest LIMIT 2', [key], 1)
              for key in scope['fund_ids']:
                  add('fund_facts', key,
                      'SELECT record_id,kind,fund_id,subject_id,as_of,source,payload FROM fund_master_facts WHERE fund_id=? ORDER BY record_id LIMIT 201', [key], 200)
              for key in scope['event_ids']:
                  add('event_key', key,
                      'SELECT event_id,company_id,company_name,date,date_key,round,amount,valuation,investors_json,sources_json FROM financing_events WHERE event_id=? ORDER BY event_id LIMIT 2', [key], 1)
              for key in scope['company_windows']:
                  day = dt.date.fromisoformat(key['day'])
                  low, high = day-dt.timedelta(days=14), day+dt.timedelta(days=14)
                  partial = sorted({low.strftime('%Y'), high.strftime('%Y'), low.strftime('%Y-%m'), high.strftime('%Y-%m')})
                  params = [key['company_id'], low.isoformat(), high.isoformat(), json.dumps(partial)]
                  add('company_date_window', key,
                      'SELECT event_id,company_id,company_name,date,date_key,round,amount,valuation,investors_json,sources_json FROM financing_events WHERE company_id=? AND ((date_key>=? AND date_key<=?) OR date_key IN (SELECT value FROM json_each(?))) ORDER BY event_id LIMIT 201', params, 200)
              return out


          def verify(scope, head, main_head, select):
              exact(head, HEX40)
              if main_head() != head:
                  raise ValueError('Main changed before read')
              checks = []
              for query in queries(scope):
                  response = select(query)
                  if not isinstance(response, dict) or response.get('success') is not True:
                      raise ValueError('D1 query failed')
                  meta = response.get('meta') or {}
                  if (type(meta.get('rows_written')) is not int or meta['rows_written'] != 0
                          or type(meta.get('rows_read')) is not int or meta['rows_read'] < 0
                          or type(meta.get('changed_db')) is not bool or meta['changed_db'] is not False):
                      raise ValueError('D1 read metrics failed')
                  rows = response.get('results')
                  if (not isinstance(rows, list) or len(rows) > query['maximum']
                          or any(not isinstance(row, dict) for row in rows)):
                      raise ValueError('D1 result bounds failed')
                  kinds = {}
                  if query['template'] == 'fund_facts':
                      if any(row.get('kind') not in KINDS for row in rows):
                          raise ValueError('Unexpected fund kind')
                      kinds = dict(sorted(Counter(row['kind'] for row in rows).items()))
                  checks.append(dict(template=query['template'], key_sha256=query['key_sha256'],
                                     count=len(rows), kinds=kinds, rows_sha256=digest(rows),
                                     rows_read=meta['rows_read'], rows_written=0))
              if main_head() != head:
                  raise ValueError('Main changed after read')
              return dict(version=1, status='verified_read_only', batch=scope['batch'],
                          scope_sha256=scope['scope_sha256'], candidate_sha256=scope['candidate_sha256'],
                          base_main_sha=scope['base_main_sha'], main_sha=head, checks=checks)


          def public_text(url, maximum=65536):
              req = urllib.request.Request(url, headers={'User-Agent': 'guanshi-fixed-readback'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(maximum+1)
              if len(raw) > maximum:
                  raise ValueError('Public response too large')
              return raw.decode('utf-8')


          def public_json(url):
              return json.loads(public_text(url), object_pairs_hook=unique_object)


          def main():
              if (os.environ.get('GITHUB_REPOSITORY') != REPO
                      or os.environ.get('GITHUB_REF') != 'refs/heads/main'
                      or os.environ.get('GITHUB_ACTOR_ID') != '110958536'
                      or os.environ.get('GITHUB_EVENT_NAME') not in ('push', 'workflow_dispatch')):
                  raise ValueError('Unapproved context')
              head = os.environ['GITHUB_SHA']; exact(head, HEX40)
              with open(os.environ['GITHUB_EVENT_PATH']) as stream:
                  event = json.load(stream)
              if os.environ['GITHUB_EVENT_NAME'] == 'push':
                  raw = public_text(f'https://raw.githubusercontent.com/{REPO}/{head}/{MANIFEST}', 8192)
                  base = event['before']
              else:
                  raw = event.get('inputs', {}).get('request', '')
                  base = head
              scope = parse_request(raw, base)
              def main_head():
                  return public_json(f'https://api.github.com/repos/{REPO}/git/ref/heads/main')['object']['sha']
              if main_head() != head:
                  raise ValueError('Main advanced while queued')
              account = os.environ['ACCOUNT']; exact(account, r'[0-9a-f]{32}')
              def api(path, payload=None):
                  body = json.dumps(payload).encode() if payload is not None else None
                  req = urllib.request.Request('https://api.cloudflare.com/client/v4/'+path, data=body,
                        headers={'Authorization': 'Bearer '+os.environ['CF_TOKEN'], 'Content-Type':'application/json'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      envelope = json.load(response)
                  if envelope.get('success') is not True:
                      raise ValueError('Cloudflare request failed')
                  return envelope['result']
              if api('user/tokens/verify').get('status') != 'active':
                  raise ValueError('Token inactive')
              root = f'accounts/{account}/d1/database'
              matches = [db for db in api(root+'?name=guanshi-financing') if db.get('name') == 'guanshi-financing']
              if len(matches) != 1:
                  raise ValueError('Database identity failed')
              exact(matches[0]['uuid'], r'[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}')
              def select(query):
                  time.sleep(0.32)
                  results = api(root+'/'+matches[0]['uuid']+'/query', {'sql':query['sql'],'params':query['params']})
                  if not isinstance(results, list) or len(results) != 1:
                      raise ValueError('Unexpected result count')
                  return results[0]
              receipt = verify(scope, head, main_head, select)
              receipt.update(run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'])
              print('D1 readback receipt '+json.dumps(receipt, sort_keys=True, separators=(',', ':')), flush=True)


          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  # Never publish exception text: it may contain API bodies, URLs or record payloads.
                  raise SystemExit('D1 readback failed closed; no detailed payload logged') from None
          PY
