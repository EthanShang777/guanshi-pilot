name: Deploy company research
on:
  workflow_dispatch:
  push:
    paths: ['research-worker/**','.github/workflows/company-research.yml']
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy research Worker
        working-directory: research-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GUANSHI_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Bind OpenAI secret
        working-directory: research-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.GUANSHI_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.GUANSHI_OPENAI_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY
