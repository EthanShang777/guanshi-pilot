name: Daily financing update
on:
  workflow_dispatch:
    inputs:
      reconcile_all:
        description: Recheck all pilot disclosures against the cloud master
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Shanghai'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-financing
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cp ledger.json "$RUNNER_TEMP/previous-ledger.json"
      - run: python update.py --replay-check --ingest-only
      - name: Sync changed disclosures to financing master
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RECONCILE_ALL: ${{ inputs.reconcile_all }}
        run: |
          if [ "$RECONCILE_ALL" = "true" ]; then
            python sync_financing.py
          else
            python sync_financing.py "$RUNNER_TEMP/previous-ledger.json"
          fi
      - name: Save ledger and pages
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh financing timeline from ChinaVenture'
            git push
          fi
      - name: Publish full D1 financing snapshot
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python publish_master.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy published pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Allow time for artifact indexing
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Retry Pages deployment
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
