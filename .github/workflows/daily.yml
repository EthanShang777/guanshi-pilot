name: Daily financing update
on:
  push:
    branches: [main]
    paths:
      - 'historical-financing/*.csv'
      - 'historical-financing/*.json'
      - '.github/workflows/daily.yml'
      - 'publish_master.py'
      - 'master-*.js'
      - 'company-history.js'
      - 'company_directory.py'
      - 'company-display-names.json'
      - 'company-browser.js'
  workflow_dispatch:
    inputs:
      published_run:
        description: Refresh interface from the current successful Pages artifact (run ID)
        type: string
        required: false
      reconcile_all:
        description: Recheck all pilot disclosures against the cloud master
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Shanghai'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-financing
  cancel-in-progress: false
env:
  # The Cloudflare API permits 1,200 requests per five minutes per token.
  D1_MIN_REQUEST_INTERVAL_SECONDS: '0.32'
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ChinaVenture disclosures
        if: inputs.published_run == '' && github.event_name != 'push'
        run: |
          cp ledger.json "$RUNNER_TEMP/previous-ledger.json"
          python update.py --replay-check --ingest-only
      - name: Sync changed disclosures to financing master
        if: inputs.published_run == '' && github.event_name != 'push'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RECONCILE_ALL: ${{ inputs.reconcile_all }}
        run: |
          if [ "$RECONCILE_ALL" = "true" ]; then
            python sync_financing.py
          else
            python sync_financing.py "$RUNNER_TEMP/previous-ledger.json"
          fi
      - name: Save ledger and pages
        if: inputs.published_run == '' && github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh financing timeline from ChinaVenture'
            git push
          fi
      - name: Identify historical data changes
        id: batches
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE" "$AFTER" -- historical-financing; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync reviewed historical financing batches
        if: inputs.published_run == '' && github.event_name != 'push' || steps.batches.outputs.changed == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python sync_financing.py --historical-dir historical-financing
      - name: Restore current public snapshot
        if: inputs.published_run != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.published_run }}
          github-token: ${{ github.token }}
          path: snapshot
      - name: Refresh published views
        if: inputs.published_run != ''
        run: |
          mkdir public
          tar -xf snapshot/artifact.tar -C public
          curl -fsSL "https://ethanshang777.github.io/guanshi-pilot/records/manifest.json?v=$GITHUB_RUN_ID" -o /tmp/live-manifest
          cmp public/records/manifest.json /tmp/live-manifest
          python refresh_public_views.py
      - name: Publish full D1 financing snapshot
        if: inputs.published_run == ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python publish_master.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy published pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Allow time for artifact indexing
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Retry Pages deployment
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
